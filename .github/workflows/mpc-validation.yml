name: Frozen MPC independent validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrea-bianco00/andrea-portfolio
          path: canonical-portfolio
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Verify simulator parity and existing tests
        env:
          GEOMETRY_TS_CORE: ${{ github.workspace }}/canonical-portfolio/app/lib/geometry-core.ts
        run: python -m pytest -q
      - name: Audit frozen MPC on predeclared independent seeds
        run: python -m evaluation.validate_mpc
      - name: Upload complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-mpc-validation-${{ github.run_id }}
          path: results/mpc_validation/
          if-no-files-found: warn
          retention-days: 30
